<div class="flex items-center justify-center h-full">
  <div class="my-auto px-5 py-5 sm:px-20 sm:py-10">
    <!-- Logo -->
    <div class="h-12 mt-3">
      <img class="h-full mx-auto" src="assets/images/logo.svg" alt="Qrove" />
    </div>
    <!-- Heading & Description -->
    <div class="my-10 text-center">
      <h1 class="text-4xl font-semibold mb-4 text-brand-primary-dark">Log Into My Account</h1>
      <h2 class="w-4/5 mx-auto text-sm font-medium text-brand-primary-dark">
        Log into your account to manage & monitor your team, projects and more.
      </h2>
    </div>

    <!-- Form -->
    <form>
      <!-- Field: Email -->
      <div class="mb-4">
        <label for="" class="text-sm block mb-2 font-semibold text-brand-primary-dark">
          Work Email/Employee ID
        </label>
        <input
          type="text"
          placeholder="Enter Work Email/Employee ID"
          class="
            w-full
            px-5
            py-5
            border-2 border-gray-light
            text-sm
            rounded-lg
            focus:outline-none focus:border-brand-primary
            transition
            text-brand-primary-dark
            font-medium
          "
        />
      </div>
      <!-- Field: Password -->
      <div class="mb-4">
        <label for="" class="text-sm block mb-2 font-semibold text-brand-primary-dark">
          Password
        </label>
        <input
          type="password"
          placeholder="Enter Password"
          class="
            w-full
            px-5
            py-5
            border-2 border-gray-light
            text-sm
            rounded-lg
            focus:outline-none focus:border-brand-primary
            transition
            text-gray-500
            font-medium
          "
        />
      </div>

      <!-- Field: Keep me logged in & forgot password link  -->
      <div class="mb-4">
        <div class="flex justify-between">
          <div>
            <input type="checkbox" name="keepLoggedIn" id="keepLoggedIn" />
            <label
              class="ml-2 font-medium text-brand-primary-dark text-sm"
              for="keepLoggedIn"
            >
              Keep me logged in
            </label>
          </div>
          <a href="#" class="text-sm text-brand-primary font-medium">
            Forgot Password?
          </a>
        </div>
      </div>

      <!-- Submit button :  Next -->
      <div class="mb-4">
        <button class="w-full bg-brand-primary text-white px-3 py-4 rounded-lg">
          Next
        </button>
      </div>

      <!-- Divider : OR -->
      <div class="my-6 text-center relative">
        <div class="border border-gray-extra-light absolute top-3 w-full"></div>
        <span
          class="
            font-semibold
            text-gray-extra-dark
            bg-white
            px-4
            w-2
            z-10
            relative
          "
        >
          OR
        </span>
      </div>

      <!-- Button : Login with 1Rivet Account  -->
      <div>
        <button
          class="
            w-full
            border border-gray-light
            text-brand-primary-dark
            font-medium
            px-3
            py-4
            rounded-lg
            flex
            items-center
            justify-center
            gap-3
          "
        >
          <svg
            width="24"
            height="24"
            viewBox="0 0 24 24"
            fill="none"
            xmlns="http://www.w3.org/2000/svg"
          >
            <path d="M0 0H11.4286V11.4286H0V0Z" fill="#F35325" />
            <path d="M12.5714 0H24V11.4286H12.5714V0Z" fill="#81BC06" />
            <path d="M0 12.5715H11.4286V24.0001H0V12.5715Z" fill="#05A6F0" />
            <path
              d="M12.5714 12.5715H24V24.0001H12.5714V12.5715Z"
              fill="#FFBA08"
            />
          </svg>

          Continue with 1Rivet Account
        </button>
      </div>
    </form>
  </div>
</div>
